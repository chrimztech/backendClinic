# Local development overrides (active whenever spring.profiles.active=dev, the default).
#
# This machine's local Postgres database was built up over time purely by
# spring.jpa.hibernate.ddl-auto=update (Flyway is disabled in dev — see
# spring.flyway.enabled in application.properties), not by the db/migration/V*.sql
# scripts. Its live/working columns ended up unquoted-lowercase (e.g. "supplierid"),
# not the snake_case the migrations use (e.g. "supplier_id"), so dev needs the
# opposite naming strategy from production to match its own already-existing schema.
#
# Do NOT copy this override into application.properties or into the prod profile —
# a fresh/production database is created from the migrations and needs the
# snake_case-producing default in application.properties to validate correctly.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
